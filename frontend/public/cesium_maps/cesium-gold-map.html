<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold Mines Map</title>
  <script src="Cesium-1.136/Build/Cesium/Cesium.js"></script>
  <link href="Cesium-1.136/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  
    #loadingMsg {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(42, 42, 42, 0.9);
      padding: 10px;
      border-radius: 5px;
      color: white;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="loadingMsg">⛏️ Loading gold mines...</div>
  

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxMDlhOTAyYS0wYzU0LTRjNWEtOGFlOC1kNDM1NWQ0MGVhNTIiLCJpZCI6MzczNTY3LCJpYXQiOjE3NjcwNTQ0MTJ9.ABCD55sad5jjbV1exj7ARmugV1ui-oZXJEKzwUxTqb0';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayerPicker: true,
      geocoder: true,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: true,
      navigationInstructionsInitiallyVisible: false,
      animation: false,
      timeline: false
    });

    let currentDataSource = null;
    viewer.scene.mode = Cesium.SceneMode.COLUMBUS_VIEW;
    // Set initial camera position (more zoomed out)
    viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(0, 20, 250000000),  // longitude, latitude, height in meters
    orientation: {
        heading: 0,
        pitch: Cesium.Math.toRadians(-90),  // Look straight down
        roll: 0
    }
    });
    // Gold mine location
    const mines = [
        {name: 'USA - Gold Mine', coords: [-116.3715395856269,40.95328702292134]},
{name: 'USA - Gold Mine', coords: [-116.2089235818317,40.77693860452497]},
{name: 'UZB - Gold Mine - Muruntau', coords: [64.58527625744301,41.48584120331313]},
{name: 'IDN - Gold Mine - Grasberg', coords: [137.1134737642439,-4.054689641507554]},
{name: 'RUS - Gold Mine', coords: [92.91126823816188,59.86704637106585]},
{name: 'DOM - Gold Mine', coords: [-70.17940558677496,18.94367487649032]},
{name: 'DRC - Gold Mine - Kibali', coords: [29.58356594988567,3.125870025604748]},
{name: 'AUS - Gold Mine - Cadia', coords: [149.002478504688,-33.49642012681549]},
{name: 'PNG - Gold Mine - Lihir', coords: [152.6349643352774,-3.125840214418852]},
{name: 'CAN - Gold Mine - Canadian Malartic', coords: [-78.10233949220695,48.11757493067488]},
{name: 'AUS - Gold Mine - Boddington', coords: [116.3541703815085,-32.75416840506686]},
{name: 'CHN - Gold Mine - Dexing Mine', coords: [117.7422345639977,29.01061964926614]},
{name: 'SAF - Gold Mine - South Deep Mine - Underground', coords: [27.67917518985568,-26.40973900918256]},
{name: 'SAF - Gold Mine - Kloof Mine - Underground and Surface', coords: [27.72222664643344,-26.36322653468859]},
{name: 'SAF - Gold Mine - Libanon Gold Mine - Underground ', coords: [27.62407754300921,-26.34449132297211]},
{name: 'SAF - Gold Mine - Driefontein ', coords: [27.49641516333844,-26.36760353496813]},
{name: '', coords: [27.4259469,-26.4384333]},
{name: 'SAF - Gold Mine - Mponeng Mine - Underground', coords: [27.40835544251746,-26.45450206655317]},
{name: 'BRA - Gold Mine', coords: [-50.06701305991393,-6.421905374105509]}
    ];

    function loadMines() {
      try {
        currentDataSource = new Cesium.CustomDataSource('gold-mines');
        
        mines.forEach(mine => {
          currentDataSource.entities.add({
            position: Cesium.Cartesian3.fromDegrees(mine.coords[0], mine.coords[1]),
            point: {
              pixelSize: 10,
              color: Cesium.Color.ORANGE,
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            },
            label: {
              text: mine.name,
              font: 'bold 16px Impact, sans-serif',
              fillColor: Cesium.Color.fromCssColorString('#FFD700'),
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 3,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              pixelOffset: new Cesium.Cartesian2(0, -25),
              backgroundColor: Cesium.Color.fromCssColorString('#8B4513').withAlpha(0.8),
              backgroundPadding: new Cesium.Cartesian2(10, 6),
              showBackground: true,
              scaleByDistance: new Cesium.NearFarScalar(1000, 1.1, 50000, 0.6)
            }
          });
        });
        
        viewer.dataSources.add(currentDataSource);
        viewer.flyTo(currentDataSource);
        
        document.getElementById('loadingMsg').textContent = `✓ ${mines.length} mines loaded!`;
        setTimeout(() => {
          document.getElementById('loadingMsg').style.display = 'none';
        }, 2000);
        
      } catch (error) {
        console.error('Error loading mines:', error);
        document.getElementById('loadingMsg').textContent = '❌ Error loading mines';
      }
    }

    function styleLabels(styleType) {
      if (!currentDataSource) return;

      const entities = currentDataSource.entities.values;

      for (let i = 0; i < entities.length; i++) {
        const entity = entities[i];
        
        if (entity.label) {
          switch(styleType) {
            case 'cute':
              entity.label.font = '14px Verdana, sans-serif';
              entity.label.fillColor = Cesium.Color.fromCssColorString('#FF1493');
              entity.label.outlineColor = Cesium.Color.WHITE;
              entity.label.outlineWidth = 2;
              entity.label.style = Cesium.LabelStyle.FILL_AND_OUTLINE;
              entity.label.pixelOffset = new Cesium.Cartesian2(0, -20);
              entity.label.backgroundColor = Cesium.Color.fromCssColorString('#FFB6C1').withAlpha(0.8);
              entity.label.backgroundPadding = new Cesium.Cartesian2(8, 4);
              entity.label.showBackground = true;
              entity.label.scaleByDistance = new Cesium.NearFarScalar(1000, 1.0, 50000, 0.5);
              break;

            case 'modern':
              entity.label.font = '13px Arial, sans-serif';
              entity.label.fillColor = Cesium.Color.WHITE;
              entity.label.outlineColor = Cesium.Color.fromCssColorString('#2196F3');
              entity.label.outlineWidth = 2;
              entity.label.style = Cesium.LabelStyle.FILL_AND_OUTLINE;
              entity.label.pixelOffset = new Cesium.Cartesian2(0, -18);
              entity.label.backgroundColor = Cesium.Color.fromCssColorString('#1976D2').withAlpha(0.85);
              entity.label.backgroundPadding = new Cesium.Cartesian2(7, 3);
              entity.label.showBackground = true;
              entity.label.scaleByDistance = new Cesium.NearFarScalar(1000, 1.0, 50000, 0.5);
              break;

            case 'bold':
              entity.label.font = 'bold 16px Impact, sans-serif';
              entity.label.fillColor = Cesium.Color.fromCssColorString('#FFD700');
              entity.label.outlineColor = Cesium.Color.BLACK;
              entity.label.outlineWidth = 3;
              entity.label.style = Cesium.LabelStyle.FILL_AND_OUTLINE;
              entity.label.pixelOffset = new Cesium.Cartesian2(0, -25);
              entity.label.backgroundColor = Cesium.Color.fromCssColorString('#8B4513').withAlpha(0.8);
              entity.label.backgroundPadding = new Cesium.Cartesian2(10, 6);
              entity.label.showBackground = true;
              entity.label.scaleByDistance = new Cesium.NearFarScalar(1000, 1.1, 50000, 0.6);
              break;

            case 'minimal':
              entity.label.font = '12px system-ui, sans-serif';
              entity.label.fillColor = Cesium.Color.fromCssColorString('#333333');
              entity.label.outlineColor = Cesium.Color.WHITE;
              entity.label.outlineWidth = 2;
              entity.label.style = Cesium.LabelStyle.FILL_AND_OUTLINE;
              entity.label.pixelOffset = new Cesium.Cartesian2(0, -16);
              entity.label.backgroundColor = Cesium.Color.WHITE.withAlpha(0.9);
              entity.label.backgroundPadding = new Cesium.Cartesian2(6, 3);
              entity.label.showBackground = true;
              entity.label.scaleByDistance = new Cesium.NearFarScalar(1000, 0.9, 50000, 0.4);
              break;
          }
        }
      }
    }
    
    loadMines();
  </script>
</body>
</html>
